"use strict";

/* =========================================================
   CAMPUSCALC
   Stable Academic Toolkit
   ========================================================= */

const STORAGE_KEY = "campuscalc_stable_v3";


/* =========================================================
   GRADE SYSTEMS
   ========================================================= */

const GRADE_POINTS = {

  "5.0": {
    A: 5,
    B: 4,
    C: 3,
    D: 2,
    E: 1,
    F: 0
  },

  "4.0": {
    A: 4,
    B: 3,
    C: 2,
    D: 1,
    F: 0
  }

};


const DAYS = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday",
  "Sunday"
];


/* =========================================================
   UNIQUE ID
   ========================================================= */

function uid() {

  return (
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2, 9)
  );

}


/* =========================================================
   DEFAULT STATE
   ========================================================= */

function defaultState() {

  return {

    page: "dashboard",

    dark: false,

    system: "5.0",

    profile: {
      name: "",
      school: "",
      department: "",
      level: "",
      matric: ""
    },

    courses: [],

    semesters: [],

    assignments: [],

    timetable: [],

    goals: [],

    notes: ""

  };

}


/* =========================================================
   NORMALIZE SAVED DATA
   ========================================================= */

function normalizeState(data) {

  const base = defaultState();

  const merged = {
    ...base,
    ...(data || {})
  };


  merged.profile = {
    ...base.profile,
    ...(data?.profile || {})
  };


  merged.courses =
    Array.isArray(data?.courses)
      ? data.courses
      : [];


  merged.semesters =
    Array.isArray(data?.semesters)
      ? data.semesters
      : [];


  merged.assignments =
    Array.isArray(data?.assignments)
      ? data.assignments
      : [];


  merged.timetable =
    Array.isArray(data?.timetable)
      ? data.timetable
      : [];


  merged.goals =
    Array.isArray(data?.goals)
      ? data.goals
      : [];


  if (!["5.0", "4.0"].includes(merged.system)) {
    merged.system = "5.0";
  }


  return merged;

}


/* =========================================================
   LOAD STATE
   ========================================================= */

function loadState() {

  try {

    const raw =
      localStorage.getItem(STORAGE_KEY);

    if (raw) {

      return normalizeState(
        JSON.parse(raw)
      );

    }

  } catch (_) {}

  return defaultState();

}


let state = loadState();


/* =========================================================
   SAVE
   ========================================================= */

function save() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(state)
    );

  } catch (_) {

    showToast(
      "Could not save data on this device."
    );

  }

}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(message) {

  const el =
    document.getElementById("toast");

  if (!el) return;

  el.textContent = message;

  el.classList.remove("hidden");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(() => {

      el.classList.add("hidden");

    }, 2400);

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function esc(value) {

  return String(value ?? "")
    .replace(/[&<>"']/g, ch => ({

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"

    }[ch]));

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function setPage(page) {

  state.page = page;

  save();

  render();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================================
   GRADE POINT
   ========================================================= */

function pointsForGrade(grade) {

  return (
    GRADE_POINTS[state.system]?.[grade] ?? 0
  );

}


/* =========================================================
   GPA CALCULATION
   ========================================================= */

function calculateGPA(
  courses = state.courses
) {

  let quality = 0;

  let units = 0;


  courses.forEach(course => {

    const unit =
      Math.max(
        0,
        Number(course.unit) || 0
      );


    quality +=
      unit *
      pointsForGrade(course.grade);


    units += unit;

  });


  return units
    ? Number(
        (quality / units).toFixed(2)
      )
    : 0;

}


/* =========================================================
   CGPA CALCULATION
   ========================================================= */

function calculateCGPA() {

  let quality = 0;

  let units = 0;


  state.semesters.forEach(
    semester => {

      const semesterUnits =
        Math.max(
          0,
          Number(semester.units) || 0
        );


      const gpa =
        Math.max(
          0,
          Number(semester.gpa) || 0
        );


      quality +=
        semesterUnits * gpa;


      units += semesterUnits;

    }
  );


  return units
    ? Number(
        (quality / units).toFixed(2)
      )
    : 0;

}


/* =========================================================
   CURRENT SEMESTER UNITS
   ========================================================= */

function currentSemesterUnits() {

  return state.courses.reduce(
    (sum, course) =>
      sum +
      Math.max(
        0,
        Number(course.unit) || 0
      ),
    0
  );

}


/* =========================================================
   PERFORMANCE MESSAGE
   ========================================================= */

function performanceText(score) {

  if (!currentSemesterUnits()) {

    return "Add your courses to calculate your GPA.";

  }


  const ratio =
    score / Number(state.system);


  if (ratio >= 0.8) {

    return "Excellent performance.";

  }


  if (ratio >= 0.7) {

    return "Very good performance.";

  }


  if (ratio >= 0.6) {

    return "Good performance.";

  }


  if (ratio >= 0.5) {

    return "Fair performance.";

  }


  return "Keep working — you can improve.";

}


/* =========================================================
   GRADE OPTIONS
   ========================================================= */

function gradeOptions(selected) {

  return Object.keys(
    GRADE_POINTS[state.system] || {}
  )
    .map(
      grade => `
        <option
          value="${grade}"
          ${selected === grade ? "selected" : ""}>
          ${grade}
        </option>

    )
    .join("");

}

"use strict";

/* =========================================
   CAMPUSCALC
   Main Application
   ========================================= */

const STORAGE_KEY = "campuscalc_stable_v3";

/* =========================================
   GRADE SYSTEMS
   ========================================= */

const GRADE_POINTS = {
  "5.0": {
    A: 5,
    B: 4,
    C: 3,
    D: 2,
    E: 1,
    F: 0
  },

  "4.0": {
    A: 4,
    B: 3,
    C: 2,
    D: 1,
    F: 0
  }
};

const DAYS = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday",
  "Sunday"
];

/* =========================================
   HELPERS
   ========================================= */

function uid() {
  return Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2, 9);
}

function esc(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[char])
  );
}

/* =========================================
   DEFAULT STATE
   ========================================= */

function defaultState() {
  return {
    page: "dashboard",

    dark: false,

    system: "5.0",

    profile: {
      name: "",
      school: "",
      department: "",
      level: "",
      matric: ""
    },

    courses: [],

    semesters: [],

    assignments: [],

    timetable: [],

    goals: [],

    notes: ""
  };
}

/* =========================================
   STATE NORMALIZATION
   ========================================= */

function normalizeState(data) {

  const base = defaultState();

  const merged = {
    ...base,
    ...(data || {})
  };

  merged.profile = {
    ...base.profile,
    ...(data?.profile || {})
  };

  merged.courses =
    Array.isArray(data?.courses)
      ? data.courses
      : [];

  merged.semesters =
    Array.isArray(data?.semesters)
      ? data.semesters
      : [];

  merged.assignments =
    Array.isArray(data?.assignments)
      ? data.assignments
      : [];

  merged.timetable =
    Array.isArray(data?.timetable)
      ? data.timetable
      : [];

  merged.goals =
    Array.isArray(data?.goals)
      ? data.goals
      : [];

  if (!["5.0", "4.0"].includes(merged.system)) {
    merged.system = "5.0";
  }

  return merged;
}

/* =========================================
   LOAD STATE
   ========================================= */

function loadState() {

  try {

    const raw =
      localStorage.getItem(STORAGE_KEY);

    if (raw) {

      return normalizeState(
        JSON.parse(raw)
      );

    }

  } catch (error) {

    console.warn(
      "Could not load CampusCalc data."
    );

  }

  return defaultState();
}

let state = loadState();

/* =========================================
   SAVE
   ========================================= */

function save() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(state)
    );

  } catch (error) {

    showToast(
      "Could not save data on this device."
    );

  }

}

/* =========================================
   TOAST
   ========================================= */

function showToast(message) {

  const toast =
    document.getElementById("toast");

  if (!toast) return;

  toast.textContent = message;

  toast.classList.remove("hidden");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(() => {

      toast.classList.add("hidden");

    }, 2400);

}

/* =========================================
   NAVIGATION
   ========================================= */

function setPage(page) {

  state.page = page;

  save();

  render();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

/* =========================================
   GPA FUNCTIONS
   ========================================= */

function pointsForGrade(grade) {

  return GRADE_POINTS[state.system]?.[grade] ?? 0;

}

function calculateGPA(courses = state.courses) {

  let quality = 0;

  let units = 0;

  courses.forEach(course => {

    const unit =
      Math.max(
        0,
        Number(course.unit) || 0
      );

    quality +=
      unit *
      pointsForGrade(course.grade);

    units += unit;

  });

  return units
    ? Number((quality / units).toFixed(2))
    : 0;

}

/* =========================================
   CGPA FUNCTIONS
   ========================================= */

function calculateCGPA() {

  let quality = 0;

  let units = 0;

  state.semesters.forEach(semester => {

    const semesterUnits =
      Math.max(
        0,
        Number(semester.units) || 0
      );

    const semesterGPA =
      Math.max(
        0,
        Number(semester.gpa) || 0
      );

    quality +=
      semesterUnits *
      semesterGPA;

    units += semesterUnits;

  });

  return units
    ? Number((quality / units).toFixed(2))
    : 0;

}

function currentSemesterUnits() {

  return state.courses.reduce(
    (total, course) =>
      total +
      Math.max(
        0,
        Number(course.unit) || 0
      ),
    0
  );

}

/* =========================================
   PERFORMANCE
   ========================================= */

function performanceText(score) {

  if (!currentSemesterUnits()) {

    return "Add your courses to calculate your GPA.";

  }

  const ratio =
    score / Number(state.system);

  if (ratio >= 0.8) {

    return "Excellent performance.";

  }

  if (ratio >= 0.7) {

    return "Very good performance.";

  }

  if (ratio >= 0.6) {

    return "Good performance.";

  }

  if (ratio >= 0.5) {

    return "Fair performance.";

  }

  return "Keep working — you can improve.";

}

   GRADE OPTIONS

function gradeOptions(selected) {

  return Object.keys(

  <script>
"use strict";

/* =========================
   CAMPUSCALC — APP LOGIC
   ========================= */

const STORAGE_KEY = "campuscalc_v4";

const GRADE_POINTS = {
  "5.0": { A: 5, B: 4, C: 3, D: 2, E: 1, F: 0 },
  "4.0": { A: 4, B: 3, C: 2, D: 1, F: 0 }
};

const DAYS = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday",
  "Sunday"
];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function defaultState() {
  return {
    page: "dashboard",
    dark: false,
    system: "5.0",

    profile: {
      name: "",
      school: "",
      department: "",
      level: "",
      matric: ""
    },

    courses: [],
    semesters: [],
    assignments: [],
    timetable: [],
    goals: [],
    notes: ""
  };
}

function normalizeState(data) {
  const base = defaultState();

  const result = {
    ...base,
    ...(data || {})
  };

  result.profile = {
    ...base.profile,
    ...(data?.profile || {})
  };

  result.courses = Array.isArray(data?.courses)
    ? data.courses
    : [];

  result.semesters = Array.isArray(data?.semesters)
    ? data.semesters
    : [];

  result.assignments = Array.isArray(data?.assignments)
    ? data.assignments
    : [];

  result.timetable = Array.isArray(data?.timetable)
    ? data.timetable
    : [];

  result.goals = Array.isArray(data?.goals)
    ? data.goals
    : [];

  if (!["5.0", "4.0"].includes(result.system)) {
    result.system = "5.0";
  }

  return result;
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
      return normalizeState(JSON.parse(saved));
    }
  } catch (error) {
    console.error(error);
  }

  return defaultState();
}

let state = loadState();

function save() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(state)
    );
  } catch (error) {
    console.error(error);
  }
}

function esc(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[char])
  );
}

function showToast(message) {
  const toast = document.getElementById("toast");

  if (!toast) return;

  toast.textContent = message;
  toast.classList.remove("hidden");

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(() => {
    toast.classList.add("hidden");
  }, 2500);
}

function setPage(page) {
  state.page = page;
  save();
  render();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function pointsForGrade(grade) {
  return GRADE_POINTS[state.system]?.[grade] ?? 0;
}

function calculateGPA() {
  let qualityPoints = 0;
  let totalUnits = 0;

  state.courses.forEach(course => {
    const units = Number(course.unit) || 0;

    qualityPoints +=
      units * pointsForGrade(course.grade);

    totalUnits += units;
  });

  return totalUnits
    ? Number((qualityPoints / totalUnits).toFixed(2))
    : 0;
}

function calculateCGPA() {
  let totalQuality = 0;
  let totalUnits = 0;

  state.semesters.forEach(semester => {
    const units = Number(semester.units) || 0;
    const gpa = Number(semester.gpa) || 0;

    totalQuality += units * gpa;
    totalUnits += units;
  });

  return totalUnits
    ? Number((totalQuality / totalUnits).toFixed(2))
    : 0;
}

function totalCurrentUnits() {
  return state.courses.reduce(
    (total, course) =>
      total + (Number(course.unit) || 0),
    0
  );
}

function gradeOptions(selected) {
  return Object.keys(
    GRADE_POINTS[state.system]
  )
    .map(grade => `
      <option
        value="${grade}"
        ${selected === grade ? "selected" : ""}
      >
        ${grade}
      </option>
    `)
    .join("");
}

/* =========================
   EVENTS
   ========================= */

function bindEvents() {

  const app = document.getElementById("app");

  app.onclick = function(event) {

    const button =
      event.target.closest("button");

    if (!button) return;

    if (button.dataset.nav) {
      setPage(button.dataset.nav);
      return;
    }

    if (
      button.dataset.action ===
      "toggle-dark"
    ) {

      state.dark = !state.dark;

      save();
      render();

      return;
    }

    if (
      button.dataset.addCourse !==
      undefined
    ) {

      state.courses.push({
        id: uid(),
        code: "",
        name: "",
        unit: 3,
        grade: "A"
      });

      save();
      render();

      return;
    }

    if (button.dataset.removeCourse) {

      state.courses =
        state.courses.filter(
          course =>
            course.id !==
            button.dataset.removeCourse
        );

      save();
      render();

      return;
    }

    if (
      button.dataset.saveSemester !==
      undefined
    ) {

      const units = totalCurrentUnits();

      if (!units) {
        showToast(
          "Add course units first."
        );
        return;
      }

      state.semesters.push({
        id: uid(),
        name:
          "Semester " +
          (state.semesters.length + 1),
        gpa: calculateGPA(),
        units,
        date:
          new Date().toLocaleDateString()
      });

      save();

      showToast(
        "Semester saved successfully."
      );

      setPage("cgpa");

      return;
    }

    if (
      button.dataset.deleteSemester
    ) {

      state.semesters =
        state.semesters.filter(
          semester =>
            semester.id !==
            button.dataset.deleteSemester
        );

      save();
      render();

      return;
    }

    if (
      button.dataset.exportResult !==
      undefined
    ) {

      printResult();

      return;
    }

    if (
      button.dataset.addTask !==
      undefined
    ) {

      const title =
        document
          .getElementById("taskTitle")
          ?.value.trim();

      const course =
        document
          .getElementById("taskCourse")
          ?.value.trim();

      const date =
        document
          .getElementById("taskDate")
          ?.value;

      if (!title) {
        showToast(
          "Enter an assignment title."
        );
        return;
      }

      state.assignments.push({
        id: uid(),
        title,
        course,
        date,
        completed: false
      });

      save();
      render();

      showToast(
        "Assignment added."
      );

      return;
    }

    if (button.dataset.toggleTask) {

      const task =
        state.assignments.find(
          item =>
            item.id ===
            button.dataset.toggleTask
        );

      if (task) {
        task.completed =
          !task.completed;
      }

      save();
      render();

      return;
    }

    if (button.dataset.deleteTask) {

      state.assignments =
        state.assignments.filter(
          item =>
            item.id !==
            button.dataset.deleteTask
        );

      save();
      render();

      return;
    }

    if (
      button.dataset.addClass !==
      undefined
    ) {

      const course =
        document
          .getElementById("classCourse")
          ?.value.trim();

      if (!course) {
        showToast(
          "Enter a course code."
        );
        return;
      }

      state.timetable.push({
        id: uid(),
        day:
          document.getElementById(
            "classDay"
          )?.value || DAYS[0],
        course,
        time:
          document
            .getElementById(
              "classTime"
            )
            ?.value.trim() || "",
        location:
          document
            .getElementById(
              "classLocation"
            )
            ?.value.trim() || ""
      });

      save();
      render();

      showToast(
        "Class added."
      );

      return;
    }

    if (button.dataset.deleteClass) {

      state.timetable =
        state.timetable.filter(
          item =>
            item.id !==
            button.dataset.deleteClass
        );

      save();
      render();

      return;
    }

    if (
      button.dataset.addGoal !==
      undefined
    ) {

      const title =
        document
          .getElementById("goalTitle")
          ?.value.trim();

      if (!title) {
        showToast(
          "Enter a goal."
        );
        return;
      }

      state.goals.push({
        id: uid(),
        title,
        completed: false
      });

      save();
      render();

      showToast(
        "Goal added."
      );

      return;
    }

    if (button.dataset.toggleGoal) {

      const goal =
        state.goals.find(
          item =>
            item.id ===
            button.dataset.toggleGoal
        );

      if (goal) {
        goal.completed =
          !goal.completed;
      }

      save();
      render();

      return;
    }

    if (button.dataset.deleteGoal) {

      state.goals =
        state.goals.filter(
          item =>
            item.id !==
            button.dataset.deleteGoal
        );

      save();
      render();

      return;
    }

    if (
      button.dataset.saveProfile !==
      undefined
    ) {

      save();

      showToast(
        "Profile saved."
      );

      setPage("dashboard");

      return;
    }

    if (
      button.dataset.export !==
      undefined
    ) {

      const blob = new Blob(
        [
          JSON.stringify(
            state,
            null,
            2
          )
        ],
        {
          type:
            "application/json"
        }
      );

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href = url;
      link.download =
        "campuscalc-backup.json";

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(url);

      showToast(
        "Backup exported."
      );

      return;
    }

    if (
      button.dataset.reset !==
      undefined
    ) {

      if (
        !confirm(
          "Delete all CampusCalc data from this device?"
        )
      ) {
        return;
      }

      localStorage.removeItem(
        STORAGE_KEY
      );

      state = defaultState();

      render();

      showToast(
        "All data has been reset."
      );

      return;
    }
  };

  app.oninput = function(event) {

    const element = event.target;

    if (element.dataset.courseField) {

      const course =
        state.courses.find(
          item =>
            item.id ===
            element.dataset.courseField
        );

      if (!course) return;

      if (
        element.dataset.field ===
        "unit"
      ) {

        course.unit =
          Number(element.value) || 0;

      } else {

        course[
          element.dataset.field
        ] = element.value;

      }

      save();

      return;
    }

    if (element.dataset.profile) {

      state.profile[
        element.dataset.profile
      ] = element.value;

      save();

      return;
    }

    if (element.id === "notesBox") {

      state.notes =
        element.value;

      save();

      return;
    }
  };

  app.onchange = function(event) {

    const element = event.target;

    if (
      element.id === "gpaSystem" ||
      element.id === "cgpaSystem"
    ) {

      state.system =
        element.value;

      state.courses.forEach(course => {

        if (
          !Object.prototype.hasOwnProperty.call(
            GRADE_POINTS[state.system],
            course.grade
          )
        ) {
          course.grade = "A";
        }

      });

      save();
      render();

      return;
    }

    if (element.dataset.courseField) {

      const course =
        state.courses.find(
          item =>
            item.id ===
            element.dataset.courseField
        );

      if (!course) return;

      course[
        element.dataset.field
      ] = element.value;

      save();
      render();

      return;
    }

    if (
      element.id === "importFile" &&
      element.files?.[0]
    ) {

      const reader =
        new FileReader();

      reader.onload = function() {

        try {

          state =
            normalizeState(
              JSON.parse(
                reader.result
              )
            );

          save();
          render();

          showToast(
            "Backup imported successfully."
          );

        } catch (error) {

          showToast(
            "Invalid backup file."
          );

        }

      };

      reader.readAsText(
        element.files[0]
      );
    }
  };
}

/* =========================
   RENDER
   ========================= */

function render() {

  document.documentElement
    .classList.toggle(
      "dark",
      !!state.dark
    );

  let html = "";

  switch (state.page) {

    case "dashboard":
      html = dashboardPage();
      break;

    case "gpa":
      html = gpaPage();
      break;

    case "cgpa":
      html = cgpaPage();
      break;

    case "tasks":
      html = tasksPage();
      break;

    case "timetable":
      html = timetablePage();
      break;

    case "goals":
      html = goalsPage();
      break;

    case "notes":
      html = notesPage();
      break;

    case "profile":
      html = profilePage();
      break;

    case "settings":
      html = settingsPage();
      break;

    case "more":
      html = morePage();
      break;

    default:
      state.page = "dashboard";
      html = dashboardPage();
  }

  document.getElementById(
    "app"
  ).innerHTML = html;

  bindEvents();
}

render();

/* =========================
   PWA INSTALL
   ========================= */

let deferredInstallPrompt = null;

const INSTALL_KEY =
  "campuscalc_install_dismissed";

function isStandalone() {

  return (
    window.matchMedia(
      "(display-mode: standalone)"
    ).matches ||
    window.navigator.standalone === true
  );
}

function isIOS() {

  return /iphone|ipad|ipod/i.test(
    navigator.userAgent
  ) ||
  (
    navigator.platform === "MacIntel" &&
    navigator.maxTouchPoints > 1
  );
}

function isAndroid() {

  return /android/i.test(
    navigator.userAgent
  );
}

function showInstallPrompt() {

  const prompt =
    document.getElementById(
      "installPrompt"
    );

  if (
    !prompt ||
    isStandalone()
  ) {
    return;
  }

  prompt.classList.remove(
    "hidden"
  );
}

function hideInstallPrompt(
  permanent = false
) {

  const prompt =
    document.getElementById(
      "installPrompt"
    );

  if (prompt) {
    prompt.classList.add(
      "hidden"
    );
  }

  if (permanent) {

    try {

      localStorage.setItem(
        INSTALL_KEY,
        "1"
      );

    } catch (_) {}

  }
}

function showInstallInstructions() {

  const text =
    document.getElementById(
      "installPromptText"
    );

  const button =
    document.getElementById(
      "installAppButton"
    );

  if (!text) return;

  if (isIOS()) {

    text.textContent =
      "Safari: tap Share, then Add to Home Screen.";

  } else if (isAndroid()) {

    text.textContent =
      "Chrome: tap ⋮ and choose Install app or Add to Home screen.";

  } else {

    text.textContent =
      "Open your browser menu and choose Install CampusCalc or Add to Home screen.";

  }

  if (button) {

    button.textContent =
      "Got it";

    button.onclick =
      () => hideInstallPrompt(false);

  }
}

window.addEventListener(
  "beforeinstallprompt",
  event => {

    event.preventDefault();

    deferredInstallPrompt =
      event;

    try {

      if (
        !localStorage.getItem(
          INSTALL_KEY
        )
      ) {

        setTimeout(
          showInstallPrompt,
          700
        );

      }

    } catch (_) {}

  }
);

window.addEventListener(
  "appinstalled",
  () => {

    deferredInstallPrompt =
      null;

    hideInstallPrompt(true);

    showToast(
      "CampusCalc installed successfully."
    );

  }
);

window.addEventListener(
  "load",
  () => {

    const installButton =
      document.getElementById(
        "installAppButton"
      );

    const dismissButton =
      document.getElementById(
        "dismissInstall"
      );

    dismissButton?.addEventListener(
      "click",
      () => hideInstallPrompt(true)
    );

    installButton?.addEventListener(
      "click",
      async () => {

        if (
          deferredInstallPrompt
        ) {

          try {

            deferredInstallPrompt.prompt();

            const choice =
              await deferredInstallPrompt
                .userChoice;

            deferredInstallPrompt =
              null;

            if (
              choice?.outcome ===
              "accepted"
            ) {

              hideInstallPrompt(true);

            } else {

              showInstallInstructions();

            }

          } catch (error) {

            deferredInstallPrompt =
              null;

            showInstallInstructions();

          }

          return;
        }

        showInstallInstructions();

      }
    );

    try {

      if (
        !isStandalone() &&
        !localStorage.getItem(
          INSTALL_KEY
        )
      ) {

        setTimeout(
          showInstallPrompt,
          1200
        );

      }

    } catch (_) {}

  }
);

/* =========================
   SERVICE WORKER
   ========================= */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )
        .then(registration => {

          registration.update()
            .catch(() => {});

        })
        .catch(error => {

          console.warn(
            "Service worker registration failed:",
            error
          );

        });

    }
  );

}
</script>
