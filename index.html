
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CampusCalc.ng — Student Academic Toolkit</title>
<meta name="description" content="CampusCalc.ng — GPA, CGPA, courses, assignments, timetable, goals and study notes.">
<meta name="theme-color" content="#2563eb">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4HK7BD7MSQ"></script>
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag("js",new Date());
gtag("config","G-4HK7BD7MSQ");
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class"};</script>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
.input{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px;background:#fff;color:#0f172a;outline:none}
.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.dark .input{background:#0f172a;border-color:#475569;color:#f8fafc}
</style>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
<div id="app"></div>

<script>
"use strict";

/* ---------- storage ---------- */
const KEY="campuscalc_stable_v1";
const GRADE_POINTS={
  "5.0":{A:5,B:4,C:3,D:2,E:1,F:0},
  "4.0":{A:4,B:3,C:2,D:1,F:0}
};
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function uid(){return Date.now()+"_"+Math.random().toString(36).slice(2,9)}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(x)return x;
  }catch(e){}
  return {
    page:"dashboard",dark:false,system:"5.0",
    profile:{name:"",school:"",department:"",level:"",matric:""},
    courses:[{id:uid(),code:"",name:"",unit:3,grade:"A",rating:0,shares:0}],
    semesters:[],assignments:[],timetable:[],goals:[],notes:""
  };
}
let state=load();

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(e){}
}
function setPage(page){
  state.page=page;
  save();
  render();
  window.scrollTo(0,0);
}
function toast(msg){
  const old=document.getElementById("toast");
  if(old)old.remove();
  const el=document.createElement("div");
  el.id="toast";
  el.className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[10000] bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl font-bold text-sm";
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2200);
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function gpa(){
  let p=0,u=0;
  state.courses.forEach(c=>{
    const units=Math.max(0,Number(c.unit)||0);
    p+=units*(GRADE_POINTS[state.system]?.[c.grade]??0);
    u+=units;
  });
  return u?+(p/u).toFixed(2):0;
}
function cgpa(){
  let p=0,u=0;
  state.semesters.forEach(s=>{
    const units=Math.max(0,Number(s.units)||0);
    p+=units*(Number(s.gpa)||0); u+=units;
  });
  return u?+(p/u).toFixed(2):0;
}
function rating(x){
  const r=x/Number(state.system);
  return !x?"Enter your courses":r>=.8?"Excellent 🎉":r>=.7?"Very Good 👍":r>=.6?"Good":r>=.5?"Fair":"Keep improving 💪";
}

/* ---------- layout ---------- */
function nav(){
  const items=[
    ["🏠","Home","dashboard"],["📊","GPA","gpa"],["🎯","CGPA","cgpa"],
    ["📝","Tasks","tasks"],["📚","More","more"]
  ];
  return `<nav class="fixed bottom-0 left-0 right-0 z-[9999] bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shadow-lg safe-bottom">
    <div class="max-w-2xl mx-auto grid grid-cols-5">
      ${items.map(x=>`<button type="button" data-nav="${x[2]}" class="min-h-[66px] w-full flex flex-col items-center justify-center text-xs font-bold ${state.page===x[2]?"text-blue-600":"text-slate-500 dark:text-slate-400"}">
        <span class="text-xl">${x[0]}</span><span>${x[1]}</span>
      </button>`).join("")}
    </div>
  </nav>`;
}
function header(){
  return `<header class="sticky top-0 z-[9998] bg-blue-700 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        ${state.page!=="dashboard"?`<button type="button" data-nav="dashboard" class="bg-blue-600 rounded-xl px-3 py-2 text-lg font-black">←</button>`:""}
        <button type="button" data-nav="dashboard" class="text-xl font-black">Campus<span class="text-blue-200">Calc</span><span class="text-xs ml-1 text-blue-200">.ng</span></button>
      </div>
      <div class="flex gap-2">
        <button type="button" data-action="dark" class="bg-blue-600 rounded-xl px-3 py-2">${state.dark?"☀️":"🌙"}</button>
        <button type="button" data-nav="profile" class="bg-blue-600 rounded-xl px-3 py-2">👤</button>
      </div>
    </div>
  </header>`;
}
function shell(title,sub,content){
  return `${header()}<main class="max-w-6xl mx-auto px-4 py-7 pb-28">
    <div class="mb-6 flex items-start gap-3">
      ${state.page!=="dashboard"?`<button type="button" data-nav="dashboard" class="border dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-2 rounded-xl font-black shadow-sm">← Back</button>`:""}
      <div><h1 class="text-3xl font-black">${title}</h1><p class="text-slate-500 dark:text-slate-400 mt-1">${sub}</p></div>
    </div>${content}
  </main>${nav()}`;
}
function card(icon,title,text,target){
  return `<button type="button" data-nav="${target}" class="text-left bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800 shadow-sm hover:shadow-md w-full">
    <div class="text-3xl">${icon}</div><h3 class="font-black text-lg mt-3">${title}</h3><p class="text-sm text-slate-500 mt-1">${text}</p>
  </button>`;
}

/* ---------- pages ---------- */
function dashboard(){
  return `${header()}<main class="max-w-7xl mx-auto px-4 py-7 pb-28">
    <section class="bg-gradient-to-br from-blue-700 via-indigo-700 to-purple-700 rounded-3xl p-6 md:p-10 text-white shadow-xl">
      <p class="text-blue-200">Welcome back 👋</p>
      <h1 class="text-3xl md:text-5xl font-black mt-2">${esc(state.profile.name||"Student")}</h1>
      <p class="mt-3 text-blue-100">${esc(state.profile.school||"Your academic dashboard")}</p>
      <button type="button" data-nav="gpa" class="mt-6 bg-white text-blue-700 font-black px-6 py-3 rounded-xl">Calculate GPA →</button>
    </section>
    <section class="grid md:grid-cols-3 gap-4 mt-6">
      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border dark:border-slate-800"><div class="text-2xl">📊</div><div class="text-sm text-slate-500 mt-2">Current GPA</div><div class="text-3xl font-black">${gpa().toFixed(2)}</div><div class="text-xs text-slate-500">out of ${state.system}</div></div>
      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border dark:border-slate-800"><div class="text-2xl">🎯</div><div class="text-sm text-slate-500 mt-2">CGPA</div><div class="text-3xl font-black">${cgpa().toFixed(2)}</div><div class="text-xs text-slate-500">out of ${state.system}</div></div>
      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border dark:border-slate-800"><div class="text-2xl">📚</div><div class="text-sm text-slate-500 mt-2">Semesters</div><div class="text-3xl font-black">${state.semesters.length}</div><div class="text-xs text-slate-500">saved</div></div>
    </section>
    <section class="grid md:grid-cols-2 gap-5 mt-6">
      ${card("📊","GPA Calculator","Calculate your semester GPA.","gpa")}
      ${card("🎯","CGPA Calculator","Track your cumulative GPA.","cgpa")}
      ${card("📝","Assignments",`${state.assignments.filter(x=>!x.completed).length} pending tasks`,"tasks")}
      ${card("📅","Timetable","Organize your classes.","timetable")}
    </section>
    <section class="mt-6 bg-white dark:bg-slate-900 rounded-2xl p-6 border dark:border-slate-800">
      <h2 class="text-xl font-black">Academic Rating</h2><p class="text-slate-500 mt-1">${rating(gpa())}</p>
    </section>
  </main>${nav()}`;
}

function gpaPage(){
  const grades=Object.keys(GRADE_POINTS[state.system]);
  return shell("GPA Calculator","Calculate your semester GPA.",`
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">
      <div class="flex gap-2 mb-6">
        ${["5.0","4.0"].map(s=>`<button type="button" data-system="${s}" class="flex-1 py-3 rounded-xl font-black ${state.system===s?"bg-blue-600 text-white":"bg-slate-100 dark:bg-slate-800"}">${s} System</button>`).join("")}
      </div>
      <div class="space-y-4">
      ${state.courses.map((c,i)=>`
        <div class="border dark:border-slate-700 rounded-2xl p-4">
          <div class="flex justify-between mb-3"><strong>Course ${i+1}</strong><button type="button" data-remove-course="${c.id}" class="text-red-500 font-bold">Remove</button></div>
          <div class="grid md:grid-cols-5 gap-3">
            <input class="input" data-course="${c.id}" data-field="code" value="${esc(c.code)}" placeholder="Course code">
            <input class="input" data-course="${c.id}" data-field="name" value="${esc(c.name)}" placeholder="Course name">
            <input class="input" type="number" min="0" max="30" data-course="${c.id}" data-field="unit" value="${esc(c.unit)}" placeholder="Units">
            <select class="input" data-course="${c.id}" data-field="grade">${grades.map(g=>`<option ${c.grade===g?"selected":""}>${g}</option>`).join("")}</select>
            <input class="input" type="number" min="0" max="5" step=".1" data-course="${c.id}" data-field="rating" value="${esc(c.rating)}" placeholder="Rate /5">
          </div>
          <div class="mt-3 flex flex-wrap items-center gap-3">
            <span class="text-sm text-slate-500">⭐ ${Number(c.rating||0).toFixed(1)}/5</span>
            <button type="button" data-share-course="${c.id}" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold">📤 Share Class</button>
            <span class="text-xs text-slate-500">Shared ${Number(c.shares)||0} time${Number(c.shares)===1?"":"s"}</span>
          </div>
        </div>`).join("")}
      </div>
      <button type="button" data-add-course class="w-full mt-5 bg-emerald-600 text-white py-3 rounded-xl font-black">+ Add Course</button>
      <div class="mt-7 bg-blue-50 dark:bg-blue-950 rounded-2xl p-7 text-center">
        <p class="text-slate-500">Your GPA</p><div class="text-6xl font-black text-blue-600 mt-2">${gpa().toFixed(2)}</div>
        <p class="mt-2">${rating(gpa())} · / ${state.system}</p>
        <button type="button" data-save-semester class="mt-5 bg-blue-600 text-white px-6 py-3 rounded-xl font-black">💾 Save Semester</button>
      </div>
    </div>`);
}
function cgpaPage(){
  return shell("CGPA Calculator","Track your academic performance across semesters.",`
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">
      <label class="text-sm font-bold">Grading system</label>
      <select class="input mt-2" data-system-select><option value="5.0" ${state.system==="5.0"?"selected":""}>5.0 System</option><option value="4.0" ${state.system==="4.0"?"selected":""}>4.0 System</option></select>
      <div class="mt-5 space-y-3">${state.semesters.length?state.semesters.map((s,i)=>`
        <div class="border dark:border-slate-700 rounded-2xl p-4"><div class="flex justify-between"><strong>${esc(s.name||"Semester "+(i+1))}</strong><button type="button" data-delete-semester="${s.id}" class="text-red-500 font-bold">Delete</button></div>
        <div class="grid md:grid-cols-3 gap-3 mt-3"><div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-xl">GPA<br><b class="text-2xl">${Number(s.gpa).toFixed(2)}</b></div><div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-xl">Units<br><b class="text-2xl">${s.units}</b></div><div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-xl">Date<br><b>${esc(s.date)}</b></div></div></div>`).join(""):`<div class="text-center py-10 text-slate-500">No semesters saved yet. Calculate and save a GPA semester first.</div>`}</div>
      <div class="mt-7 bg-indigo-50 dark:bg-indigo-950 rounded-2xl p-7 text-center"><p class="text-slate-500">Current CGPA</p><div class="text-6xl font-black text-indigo-600 mt-2">${cgpa().toFixed(2)}</div><p class="mt-2">out of ${state.system}</p></div>
    </div>`);
}
function tasksPage(){
  return shell("Assignments","Keep track of your academic tasks.",`
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">
      <div class="grid md:grid-cols-3 gap-3"><input id="taskTitle" class="input" placeholder="Assignment title"><input id="taskCourse" class="input" placeholder="Course"><input id="taskDate" class="input" type="date"></div>
      <button type="button" data-add-task class="w-full mt-3 bg-blue-600 text-white py-3 rounded-xl font-black">+ Add Assignment</button>
    </div>
    <div class="mt-5 space-y-3">${state.assignments.length?state.assignments.map(a=>`
      <div class="bg-white dark:bg-slate-900 border dark:border-slate-800 rounded-2xl p-4 flex items-center gap-3">
        <button type="button" data-toggle-task="${a.id}" class="text-2xl">${a.completed?"✅":"⬜"}</button>
        <div class="flex-1"><b class="${a.completed?"line-through opacity-60":""}">${esc(a.title)}</b><div class="text-sm text-slate-500">${esc(a.course||"General")} · ${esc(a.date||"No date")}</div></div>
        <button type="button" data-delete-task="${a.id}" class="text-red-500">🗑️</button>
      </div>`).join(""):`<div class="text-center py-12 bg-white dark:bg-slate-900 rounded-2xl border dark:border-slate-800 text-slate-500">📝<br>No assignments yet.</div>`}</div>`);
}
function timetablePage(){
  return shell("Timetable","Organize your weekly classes.",`
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">
      <div class="grid md:grid-cols-4 gap-3"><select id="classDay" class="input">${DAYS.map(d=>`<option>${d}</option>`).join("")}</select><input id="classCourse" class="input" placeholder="Course"><input id="classTime" class="input" placeholder="Time e.g. 10:00 AM"><input id="classLocation" class="input" placeholder="Location"></div>
      <button type="button" data-add-class class="w-full mt-3 bg-blue-600 text-white py-3 rounded-xl font-black">+ Add Class</button>
    </div>
    <div class="grid md:grid-cols-2 gap-4 mt-5">${state.timetable.length?state.timetable.map(x=>`<div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800"><div class="flex justify-between"><div><b class="text-blue-600">${x.day}</b><h3 class="text-xl font-black">${esc(x.course)}</h3><p class="text-slate-500">${esc(x.time||"Time not added")}</p><p class="text-slate-500">📍 ${esc(x.location||"Location not added")}</p></div><button type="button" data-delete-class="${x.id}" class="text-red-500">🗑️</button></div></div>`).join(""):`<div class="md:col-span-2 text-center py-12 text-slate-500 bg-white dark:bg-slate-900 rounded-2xl border dark:border-slate-800">📅<br>Your timetable is empty.</div>`}</div>`);
}
function goalsPage(){
  return shell("Academic Goals","Set goals and track your progress.",`
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800 flex gap-2"><input id="goalTitle" class="input" placeholder="e.g. Get 4.5 GPA"><button type="button" data-add-goal class="bg-blue-600 text-white px-5 rounded-xl font-black">Add</button></div>
    <div class="mt-5 space-y-3">${state.goals.length?state.goals.map(g=>`<div class="bg-white dark:bg-slate-900 border dark:border-slate-800 rounded-2xl p-4 flex gap-3 items-center"><button type="button" data-toggle-goal="${g.id}" class="text-xl">${g.completed?"✅":"⬜"}</button><div class="flex-1 font-bold ${g.completed?"line-through opacity-60":""}">${esc(g.title)}</div><button type="button" data-delete-goal="${g.id}" class="text-red-500">🗑️</button></div>`).join(""):`<div class="text-center py-12 text-slate-500">🎯<br>No goals yet.</div>`}</div>`);
}
function notesPage(){
  return shell("Study Notes","Your notes are saved automatically on this device.",`<div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800"><textarea id="notesBox" class="input min-h-[320px]" placeholder="Write your study notes here...">${esc(state.notes)}</textarea></div>`);
}
function profilePage(){
  const fields=[["name","Full name"],["school","School / University"],["department","Department"],["level","Level"],["matric","Matric number"]];
  return shell("Student Profile","Manage your student information.",`<div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800 space-y-4">${fields.map(x=>`<label class="block text-sm font-bold">${x[1]}<input class="input mt-2" data-profile="${x[0]}" value="${esc(state.profile[x[0]])}" placeholder="${x[1]}"></label>`).join("")}<button type="button" data-save-profile class="w-full bg-blue-600 text-white py-3 rounded-xl font-black">Save Profile</button></div>`);
}
function settingsPage(){
  return shell("Settings & Data","Manage your CampusCalc data.",`
    <div class="space-y-4">
      <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800"><b>Appearance</b><br><button type="button" data-action="dark" class="mt-3 bg-slate-100 dark:bg-slate-800 px-5 py-3 rounded-xl font-bold">${state.dark?"☀️ Light mode":"🌙 Dark mode"}</button></div>
      <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800"><b>Backup</b><div class="flex flex-wrap gap-3 mt-3"><button type="button" data-export class="bg-blue-600 text-white px-5 py-3 rounded-xl font-bold">📤 Export Data</button><label class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold cursor-pointer">📥 Import Data<input id="importFile" type="file" accept=".json,application/json" class="hidden"></label></div></div>
      <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-red-200"><b>Danger zone</b><br><button type="button" data-reset class="mt-3 bg-red-600 text-white px-5 py-3 rounded-xl font-bold">🔄 Reset All Data</button></div>
    </div>`);
}
function morePage(){
  return shell("More Tools","More ways to organize your student life.",`<div class="grid md:grid-cols-2 gap-4">
    ${card("📅","Timetable","Organize weekly classes.","timetable")}
    ${card("🎯","Academic Goals","Set goals and track progress.","goals")}
    ${card("🗒️","Study Notes","Keep your study notes.","notes")}
    ${card("👤","Student Profile","Manage your information.","profile")}
    ${card("⚙️","Settings & Data","Backup, import or reset data.","settings")}
  </div>`);
}

/* ---------- render ---------- */
function render(){
  document.documentElement.classList.toggle("dark",!!state.dark);
  let html="";
  switch(state.page){
    case "dashboard":html=dashboard();break;
    case "gpa":html=gpaPage();break;
    case "cgpa":html=cgpaPage();break;
    case "tasks":html=tasksPage();break;
    case "timetable":html=timetablePage();break;
    case "goals":html=goalsPage();break;
    case "notes":html=notesPage();break;
    case "profile":html=profilePage();break;
    case "settings":html=settingsPage();break;
    case "more":html=morePage();break;
    default:state.page="dashboard";html=dashboard();
  }
  document.getElementById("app").innerHTML=html;
  bind();
}

/* ---------- events: one delegated click handler ---------- */
function bind(){
  const app=document.getElementById("app");
  app.onclick=async function(e){
    const el=e.target.closest("button,[data-nav],[data-action],[data-system],[data-course],[data-profile],[data-add-course],[data-share-course]");
    if(!el || !app.contains(el))return;

    const navTarget=el.dataset.nav;
    if(navTarget){setPage(navTarget);return}

    if(el.dataset.action==="dark"){
      state.dark=!state.dark;save();render();return;
    }
    if(el.dataset.system){
      state.system=el.dataset.system;save();render();return;
    }
    if(el.hasAttribute("data-add-course")){
      state.courses.push({id:uid(),code:"",name:"",unit:3,grade:"A",rating:0,shares:0});
      save();render();return;
    }
    if(el.dataset.removeCourse){
      state.courses=state.courses.filter(c=>c.id!==el.dataset.removeCourse);
      if(!state.courses.length)state.courses.push({id:uid(),code:"",name:"",unit:3,grade:"A",rating:0,shares:0});
      save();render();return;
    }
    if(el.dataset.shareCourse){
      const c=state.courses.find(x=>x.id===el.dataset.shareCourse);
      if(c){
        const text=`${c.name||c.code||"My class"}${c.code&&c.name?" ("+c.code+")":""}\nRating: ${c.rating||0}/5\nShared from CampusCalc.ng`;
        try{
          if(navigator.share)await navigator.share({title:"CampusCalc Class",text});
          else await navigator.clipboard.writeText(text);
          c.shares=(Number(c.shares)||0)+1;save();toast("Class shared!");
        }catch(e){}
      }
      return;
    }
    if(el.dataset.saveSemester){
      const units=state.courses.reduce((a,c)=>a+(Number(c.unit)||0),0);
      if(!units){toast("Add course units first.");return}
      state.semesters.push({id:uid(),name:"Semester "+(state.semesters.length+1),gpa:gpa(),units,system:state.system,date:new Date().toLocaleDateString()});
      save();toast("Semester saved!");setPage("cgpa");return;
    }
    if(el.dataset.deleteSemester){
      state.semesters=state.semesters.filter(x=>x.id!==el.dataset.deleteSemester);save();render();return;
    }
    if(el.dataset.addTask){
      const title=document.getElementById("taskTitle").value.trim();
      if(!title){toast("Enter an assignment title.");return}
      state.assignments.push({id:uid(),title,course:document.getElementById("taskCourse").value.trim(),date:document.getElementById("taskDate").value,completed:false});
      save();render();toast("Assignment added!");return;
    }
    if(el.dataset.toggleTask){const x=state.assignments.find(a=>a.id===el.dataset.toggleTask);if(x)x.completed=!x.completed;save();render();return}
    if(el.dataset.deleteTask){state.assignments=state.assignments.filter(a=>a.id!==el.dataset.deleteTask);save();render();return}
    if(el.dataset.addClass){
      const course=document.getElementById("classCourse").value.trim();
      if(!course){toast("Enter a course.");return}
      state.timetable.push({id:uid(),day:document.getElementById("classDay").value,course,time:document.getElementById("classTime").value,location:document.getElementById("classLocation").value.trim()});
      save();render();toast("Class added!");return;
    }
    if(el.dataset.deleteClass){state.timetable=state.timetable.filter(x=>x.id!==el.dataset.deleteClass);save();render();return}
    if(el.dataset.addGoal){
      const title=document.getElementById("goalTitle").value.trim();
      if(!title){toast("Enter a goal.");return}
      state.goals.push({id:uid(),title,completed:false});save();render();toast("Goal added!");return;
    }
    if(el.dataset.toggleGoal){const x=state.goals.find(g=>g.id===el.dataset.toggleGoal);if(x)x.completed=!x.completed;save();render();return}
    if(el.dataset.deleteGoal){state.goals=state.goals.filter(g=>g.id!==el.dataset.deleteGoal);save();render();return}
    if(el.dataset.saveProfile){save();toast("Profile saved!");setPage("dashboard");return}
    if(el.dataset.export){
      const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download="campuscalc-backup.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast("Backup exported!");return;
    }
    if(el.dataset.reset){
      if(confirm("Delete all CampusCalc data from this device?")){
        localStorage.removeItem(KEY);state=load();render();toast("Data reset.");
      }
      return;
    }
  };

  app.oninput=function(e){
    const el=e.target;
    if(el.dataset.course){
      const c=state.courses.find(x=>x.id===el.dataset.course);
      if(c){c[el.dataset.field]=el.value;save();}
      if(el.dataset.field==="unit"||el.dataset.field==="grade"||el.dataset.field==="rating")render();
      return;
    }
    if(el.dataset.profile){
      state.profile[el.dataset.profile]=el.value;save();return;
    }
    if(el.id==="notesBox"){state.notes=el.value;save();return}
  };
  app.onchange=function(e){
    const el=e.target;
    if(el.dataset.systemSelect){state.system=el.value;save();render();return}
    if(el.id==="importFile"&&el.files[0]){
      const reader=new FileReader();
      reader.onload=()=>{try{const d=JSON.parse(reader.result);state={...state,...d,page:"settings"};save();render();toast("Backup imported!")}catch(e){toast("Invalid backup file.")}};
      reader.readAsText(el.files[0]);
    }
    if(el.dataset.course){
      const c=state.courses.find(x=>x.id===el.dataset.course);
      if(c){c[el.dataset.field]=el.value;save();render();}
    }
  };
}

render();
</script>
</body>
</html>
