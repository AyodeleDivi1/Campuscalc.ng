<script>
"use strict";

/* =========================
   CampusCalc — stable v2
   ========================= */

const STORAGE_KEY = "campuscalc_stable_v2";

/* =========================
   Firebase — Feedback backend
   ========================= */
const firebaseConfig = {
  // Replace this placeholder with the Web API key from Firebase Console > Project settings > Your apps.
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "campuscalc-1a78b.firebaseapp.com",
  projectId: "campuscalc-1a78b",
  storageBucket: "campuscalc-1a78b.firebasestorage.app",
  messagingSenderId: "45206566971",
  appId: "1:45206566971:web:08a8cf40de2c09c3d9841e",
  measurementId: "G-4HK7BD7MSQ"
};

let db = null;
const firebaseReady = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_FIREBASE_API_KEY";
try {
  if (firebaseReady) {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } else {
    console.warn("CampusCalc feedback is in local fallback mode until the Firebase Web API key is added.");
  }
} catch (error) {
  console.error("Firebase initialization failed:", error);
}

const GRADE_POINTS = {
  "5.0": { A: 5, B: 4, C: 3, D: 2, E: 1, F: 0 },
  "4.0": { A: 4, B: 3, C: 2, D: 1, F: 0 }
};

const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function uid() {
  return Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
}

function defaultState() {
  return {
    page: "dashboard",
    dark: false,
    system: "5.0",
    profile: { name: "", school: "", department: "", level: "", matric: "" },
    courses: [],
    semesters: [],
    assignments: [],
    timetable: [],
    goals: [],
    notes: "",
    feedbackDraft: { type: "Suggestion", message: "" }
  };
}

function normalizeState(data) {
  const base = defaultState();
  const merged = { ...base, ...(data || {}) };
  merged.profile = { ...base.profile, ...(data?.profile || {}) };
  merged.feedbackDraft = { ...base.feedbackDraft, ...(data?.feedbackDraft || {}) };
  merged.courses = Array.isArray(data?.courses) ? data.courses : [];
  merged.semesters = Array.isArray(data?.semesters) ? data.semesters : [];
  merged.assignments = Array.isArray(data?.assignments) ? data.assignments : [];
  merged.timetable = Array.isArray(data?.timetable) ? data.timetable : [];
  merged.goals = Array.isArray(data?.goals) ? data.goals : [];
  if (!["5.0","4.0"].includes(merged.system)) merged.system = "5.0";
  return merged;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalizeState(JSON.parse(raw));
  } catch (_) {}
  return defaultState();
}

let state = loadState();

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (_) {
    showToast("Could not save data on this device.");
  }
}

function showToast(message) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = message;
  el.classList.remove("hidden");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.add("hidden"), 2400);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[ch]));
}

function setPage(page) {
  state.page = page;
  save();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function pointsForGrade(grade) {
  return GRADE_POINTS[state.system]?.[grade] ?? 0;
}

function calculateGPA(courses = state.courses) {
  let quality = 0;
  let units = 0;

  courses.forEach(course => {
    const u = Math.max(0, Number(course.unit) || 0);
    quality += u * pointsForGrade(course.grade);
    units += u;
  });

  return units ? Number((quality / units).toFixed(2)) : 0;
}

function calculateCGPA() {
  let quality = 0;
  let units = 0;

  state.semesters.forEach(semester => {
    const u = Math.max(0, Number(semester.units) || 0);
    const g = Math.max(0, Number(semester.gpa) || 0);
    quality += u * g;
    units += u;
  });

  return units ? Number((quality / units).toFixed(2)) : 0;
}

function currentSemesterUnits() {
  return state.courses.reduce((sum, c) => sum + Math.max(0, Number(c.unit) || 0), 0);
}

function performanceText(score) {
  if (!currentSemesterUnits()) return "Add your courses to calculate your GPA.";
  const ratio = score / Number(state.system);
  if (ratio >= .8) return "Excellent performance.";
  if (ratio >= .7) return "Very good performance.";
  if (ratio >= .6) return "Good performance.";
  if (ratio >= .5) return "Fair performance.";
  return "Keep working — you can improve.";
}

function gradeOptions(selected) {
  return Object.keys(GRADE_POINTS[state.system] || {}).map(g =>
    `<option value="${g}" ${selected === g ? "selected" : ""}>${g}</option>`
  ).join("");
}

/* ---------- shared UI ---------- */

function header() {

      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">

}

function bottomNav() {

  `;
}

function shell(title, subtitle, content) {
  return `

    <main class="max-w-6xl mx-auto px-4 py-7 pb-28">

        <p class="mt-1 text-slate-500 dark:text-slate-400">${subtitle}</p>
      </div>
      ${content}
    </main>
    ${bottomNav()}
  `;
}

function card(icon, title, description, target) {
  return `
    <button type="button" data-nav="${target}"
      class="app-card text-left bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 w-full">
      <div class="w-11 h-11 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-xl">${icon}</div>
      <h3 class="font-black text-lg mt-4">${title}</h3>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${description}</p>
      <span class="inline-block mt-4 text-sm font-bold text-blue-600 dark:text-blue-400">Open →</span>
    </button>
  `;
}

/* ---------- dashboard ---------- */

    ${header()}
    <main class="max-w-7xl mx-auto px-4 py-7 pb-28">

        <h1 class="hero-title text-4xl md:text-5xl font-black mt-2">

        </h1>
        <p class="mt-3 text-slate-300 max-w-2xl">

        </p>
        <div class="mt-7 flex flex-wrap gap-3">

          </button>

        </div>
      </section>

      <section class="grid md:grid-cols-3 gap-4 mt-6">
        <button type="button" data-nav="cgpa"
          class="text-left bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800">
          <p class="text-sm text-slate-500">Current CGPA</p>
          <div class="text-4xl font-black mt-2">${cgpa.toFixed(2)}</div>
          <p class="text-xs text-slate-500 mt-1">out of ${state.system}</p>

        <button type="button" data-nav="gpa"
          class="text-left bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800">

/* ---------- GPA ---------- */

function gpaPage() {
  const gpa = calculateGPA();

  return shell(
    "GPA Calculator",
    "Calculate your current semester GPA, then save the semester to your CGPA.",
    `
      <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
          <div>
            <h2 class="text-xl font-black">Current Semester</h2>
            <p class="text-sm text-slate-500 mt-1">Enter each course, its unit and your grade.</p>
          </div>
          <select id="gpaSystem" class="input sm:w-44">
            <option value="5.0" ${state.system === "5.0" ? "selected" : ""}>5.0 System</option>
            <option value="4.0" ${state.system === "4.0" ? "selected" : ""}>4.0 System</option>
          </select>
        </div>

/* ---------- events ---------- */

function bindEvents() {
  const app = document.getElementById("app");

  app.onclick = async function(e) {
    const el = e.target.closest("button");
    if (!el || !app.contains(el)) return;

    if (el.dataset.nav) {
      setPage(el.dataset.nav);
      return;
    }

    if (el.dataset.action === "toggle-dark") {
      state.dark = !state.dark;
      save();
      render();
      return;
    }

    if (el.dataset.addCourse !== undefined) {
      state.courses.push({
        id: uid(),
        code: "",
        name: "",
        unit: 3,
        grade: "A"
      });
      save();
      render();
      return;
    }

    if (el.dataset.removeCourse) {
      if (state.courses.length <= 1) {
        showToast("Keep at least one course.");
        return;
      }
      state.courses = state.courses.filter(c => c.id !== el.dataset.removeCourse);
      save();
      render();
      return;
    }

    if (el.dataset.saveSemester !== undefined) {
      const units = currentSemesterUnits();
      if (!units) {
        showToast("Add credit units before saving.");
        return;
      }

      const gpa = calculateGPA();
      state.semesters.push({
        id: uid(),
        name: "Semester " + (state.semesters.length + 1),
        gpa,
        units,
        system: state.system,
        date: new Date().toLocaleDateString()
      });

      save();
      showToast("Semester saved to CGPA.");
      setPage("cgpa");
      return;
    }

    if (el.dataset.deleteSemester) {
      if (!confirm("Delete this saved semester?")) return;
      state.semesters = state.semesters.filter(s => s.id !== el.dataset.deleteSemester);
      save();
      render();
      return;
    }

    if (el.dataset.exportPdf !== undefined) {
      exportResult();
      return;
    }

    if (el.dataset.addTask !== undefined) {
      const title = document.getElementById("taskTitle")?.value.trim();
      const course = document.getElementById("taskCourse")?.value.trim();
      const date = document.getElementById("taskDate")?.value;

      if (!title) {
        showToast("Enter an assignment title.");
        return;
      }

      state.assignments.push({ id: uid(), title, course, date, completed: false });
      save();
      render();
      showToast("Assignment added.");
      return;
    }

    if (el.dataset.toggleTask) {
      const task = state.assignments.find(a => a.id === el.dataset.toggleTask);
      if (task) task.completed = !task.completed;
      save();
      render();
      return;
    }

    if (el.dataset.deleteTask) {
      state.assignments = state.assignments.filter(a => a.id !== el.dataset.deleteTask);
      save();
      render();
      return;
    }

    if (el.dataset.addClass !== undefined) {
      const course = document.getElementById("classCourse")?.value.trim();
      if (!course) {
        showToast("Enter a course code.");
        return;
      }

      state.timetable.push({
        id: uid(),
        day: document.getElementById("classDay")?.value || DAYS[0],
        course,
        time: document.getElementById("classTime")?.value.trim() || "",
        location: document.getElementById("classLocation")?.value.trim() || ""
      });

      save();
      render();
      showToast("Class added.");
      return;
    }

    if (el.dataset.deleteClass) {
      state.timetable = state.timetable.filter(x => x.id !== el.dataset.deleteClass);
      save();
      render();
      return;
    }

    if (el.dataset.addGoal !== undefined) {
      const title = document.getElementById("goalTitle")?.value.trim();
      if (!title) {
        showToast("Enter a goal.");
        return;
      }

      state.goals.push({ id: uid(), title, completed: false });
      save();
      render();
      showToast("Goal added.");
      return;
    }

    if (el.dataset.toggleGoal) {
      const goal = state.goals.find(g => g.id === el.dataset.toggleGoal);
      if (goal) goal.completed = !goal.completed;
      save();
      render();
      return;
    }

    if (el.dataset.deleteGoal) {
      state.goals = state.goals.filter(g => g.id !== el.dataset.deleteGoal);
      save();
      render();
      return;
    }

    if (el.dataset.saveProfile !== undefined) {
      save();
      showToast("Profile saved.");
      setPage("dashboard");
      return;
    }

    if (el.dataset.sendFeedback !== undefined) {
      const type = document.getElementById("feedbackType")?.value || "Suggestion";
      const message = document.getElementById("feedbackMessage")?.value.trim() || "";

      if (!message) {
        showToast("Write your feedback first.");
        return;
      }

      // Prevent accidental double submissions while the request is running.
      el.disabled = true;
      el.textContent = "Sending...";

      const feedback = {
        id: uid(),
        type,
        message,
        page: state.page,
        status: "new",
        createdAt: new Date().toISOString()
      };

      try {
        if (db) {
          await db.collection("feedback").add({
            type: feedback.type,
            message: feedback.message,
            page: feedback.page,
            status: feedback.status,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          state.feedbackDraft = { type: "Suggestion", message: "" };
          save();
          render();
          showToast("Thanks! Your feedback has been submitted successfully.");
        } else {
          const queued = JSON.parse(localStorage.getItem("campuscalc_feedback_queue") || "[]");
          queued.push(feedback);
          localStorage.setItem("campuscalc_feedback_queue", JSON.stringify(queued));
          state.feedbackDraft = { type: "Suggestion", message: "" };
          save();
          render();
          showToast("Feedback saved on this device. Connect Firebase to send it to the CampusCalc inbox.");
        }
      } catch (error) {
        console.error("Feedback submission failed:", error);
        el.disabled = false;
        el.textContent = "Send Feedback";
        showToast("Could not submit feedback. Please try again.");
      }
      return;
    }

    if (el.dataset.export !== undefined) {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "campuscalc-backup.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast("Backup exported.");
      return;
    }

    if (el.dataset.reset !== undefined) {
      if (!confirm("Delete all CampusCalc data from this device?")) return;
      localStorage.removeItem(STORAGE_KEY);
      state = loadState();
      render();
      showToast("Data reset.");
      return;
    }
  };

  app.oninput = function(e) {
    const el = e.target;

    if (el.dataset.courseField) {
      const course = state.courses.find(c => c.id === el.dataset.courseField);
      if (!course) return;

      if (el.dataset.field === "unit") {
        course.unit = Math.max(0, Number(el.value) || 0);
      } else {
        course[el.dataset.field] = el.value;
      }

      save();
      return;
    }

    if (el.dataset.profile) {
      state.profile[el.dataset.profile] = el.value;
      save();
      return;
    }

    if (el.id === "notesBox") {
      state.notes = el.value;
      save();
      return;
    }

    if (el.id === "feedbackMessage") {
      state.feedbackDraft.message = el.value;
      save();
      return;
    }
  };

  app.onchange = function(e) {
    const el = e.target;

    if (el.id === "gpaSystem" || el.id === "cgpaSystem") {
      state.system = el.value;
      state.courses.forEach(c => {
        if (!Object.prototype.hasOwnProperty.call(GRADE_POINTS[state.system], c.grade)) {
          c.grade = "A";
        }
      });
      save();
      render();
      return;
    }

    if (el.dataset.courseField) {
      const course = state.courses.find(c => c.id === el.dataset.courseField);
      if (!course) return;

      course[el.dataset.field] = el.value;
      save();
      render();
      return;
    }

    if (el.id === "feedbackType") {
      state.feedbackDraft.type = el.value;
      save();
      return;
    }

    if (el.id === "importFile" && el.files?.[0]) {
      const reader = new FileReader();

      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          state = normalizeState(imported);
          save();
          render();
          showToast("Backup imported successfully.");
        } catch (_) {
          showToast("That backup file is not valid.");
        }
      };

      reader.readAsText(el.files[0]);
    }
  };
}

/* ---------- render ---------- */

function render() {
  document.documentElement.classList.toggle("dark", !!state.dark);

  let html;

  switch (state.page) {
    case "dashboard": html = dashboardPage(); break;
    case "cgpa": html = cgpaPage(); break;
    case "gpa": html = gpaPage(); break;
    case "tasks": html = tasksPage(); break;
    case "timetable": html = timetablePage(); break;
    case "goals": html = goalsPage(); break;
    case "notes": html = notesPage(); break;
    case "profile": html = profilePage(); break;
    case "feedback": html = feedbackPage(); break;
    case "settings": html = settingsPage(); break;
    case "more": html = morePage(); break;
    default:
      state.page = "dashboard";
      html = dashboardPage();
  }

  document.getElementById("app").innerHTML = html;
  bindEvents();
}

render();


/* ---------- install prompt ---------- */
let deferredInstallPrompt = null;
const INSTALL_DISMISSED_KEY = "campuscalc_install_dismissed_v2";

function isStandaloneMode() {
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}

function isAndroid() {
  return /android/i.test(navigator.userAgent);
}

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function showInstallPrompt() {
  const prompt = document.getElementById("installPrompt");
  if (!prompt || isStandaloneMode()) return;
  prompt.classList.remove("hidden");
}

function hideInstallPrompt(permanent = false) {
  const prompt = document.getElementById("installPrompt");
  if (prompt) prompt.classList.add("hidden");
  if (permanent) {
    try { localStorage.setItem(INSTALL_DISMISSED_KEY, "1"); } catch (_) {}
  }
}

function showInstallInstructions() {
  const text = document.getElementById("installPromptText");
  const button = document.getElementById("installAppButton");
  if (!text) return;

  if (isIOS()) {
    text.textContent = "Safari: tap Share, then choose Add to Home Screen, then tap Add.";
  } else if (isAndroid()) {
    text.textContent = "Chrome: tap ⋮ in the top-right menu, then choose Install app or Add to Home screen.";
  } else {
    text.textContent = "Open your browser menu and choose Install CampusCalc, Install app, or Add to Home screen.";
  }

  if (button) {
    button.textContent = "Got it";
    button.onclick = () => hideInstallPrompt(false);
  }
}

window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();
  deferredInstallPrompt = event;
  if (!localStorage.getItem(INSTALL_DISMISSED_KEY)) {
    setTimeout(showInstallPrompt, 700);
  }
});

window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  hideInstallPrompt(true);
  showToast("CampusCalc installed successfully.");
});

window.addEventListener("load", () => {
  const installButton = document.getElementById("installAppButton");
  const dismissButton = document.getElementById("dismissInstall");

  dismissButton?.addEventListener("click", () => hideInstallPrompt(true));

  installButton?.addEventListener("click", async () => {
    if (deferredInstallPrompt) {
      try {
        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        if (choice?.outcome === "accepted") {
          hideInstallPrompt(true);
        } else {
          showInstallInstructions();
        }
      } catch (_) {
        deferredInstallPrompt = null;
        showInstallInstructions();
      }
      return;
    }

    // A website cannot force the browser's native install dialog when the
    // browser has not supplied beforeinstallprompt. Give the user the exact
    // manual install path instead of making the button appear unresponsive.
    showInstallInstructions();
  });

  if (!isStandaloneMode() && !localStorage.getItem(INSTALL_DISMISSED_KEY)) {
    setTimeout(showInstallPrompt, 1200);
  }
});

/* ---------- offline support ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").then(registration => {
      registration.update().catch(() => {});
    }).catch(() => {});
  });
}
</script>
