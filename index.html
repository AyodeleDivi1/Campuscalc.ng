<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>CampusCalc.ng — Student Academic Toolkit</title>

<meta name="description" content="CampusCalc.ng is a free academic toolkit for Nigerian students. Calculate GPA and CGPA, manage courses, assignments, timetable, goals and notes.">

<meta name="theme-color" content="#2563eb">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4HK7BD7MSQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-4HK7BD7MSQ');
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
tailwind.config={darkMode:"class"};
</script>

<style>
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input,select,textarea{font:inherit}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
.input{
  width:100%;
  box-sizing:border-box;
  border:1px solid #cbd5e1;
  border-radius:.75rem;
  padding:.75rem;
  background:#fff;
  color:#0f172a;
  outline:none
}
.input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 2px rgba(37,99,235,.12)
}
.dark .input{
  background:#0f172a;
  border-color:#334155;
  color:#f8fafc
}
.dark .input::placeholder{color:#94a3b8}
</style>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">

<div id="root"></div>

<script type="text/babel">

const {useState,useEffect}=React;

const GRADE_POINTS={
 "5.0":{A:5,B:4,C:3,D:2,E:1,F:0},
 "4.0":{A:4,B:3,C:2,D:1,F:0}
};

const DAYS=[
 "Monday",
 "Tuesday",
 "Wednesday",
 "Thursday",
 "Friday",
 "Saturday",
 "Sunday"
];

function uid(){
 return Date.now()+Math.floor(Math.random()*100000)
}

function getStorage(key,fallback){
 try{
  const x=localStorage.getItem(key);
  return x===null?fallback:JSON.parse(x);
 }catch{
  return fallback
 }
}

function saveStorage(key,value){
 try{
  localStorage.setItem(key,JSON.stringify(value))
 }catch{}
}

function App(){

 const [page,setPage]=useState("dashboard");

 const [darkMode,setDarkMode]=useState(
  ()=>getStorage("cc_dark",false)
 );

 const [gradingSystem,setGradingSystem]=useState(
  ()=>getStorage("cc_system","5.0")
 );

 const [profile,setProfile]=useState(
  ()=>getStorage(
   "cc_profile",
   {
    name:"",
    school:"",
    department:"",
    level:"",
    matric:""
   }
  )
 );

 const [courses,setCourses]=useState(
  ()=>getStorage(
   "cc_courses",
   [
    {
     id:uid(),
     code:"",
     name:"",
     unit:3,
     grade:"A",
     rating:0,
     shares:0
    }
   ]
  )
 );

 const [semesters,setSemesters]=useState(
  ()=>getStorage("cc_semesters",[])
 );

 const [assignments,setAssignments]=useState(
  ()=>getStorage("cc_assignments",[])
 );

 const [timetable,setTimetable]=useState(
  ()=>getStorage("cc_timetable",[])
 );

 const [goals,setGoals]=useState(
  ()=>getStorage("cc_goals",[])
 );

 const [notes,setNotes]=useState(
  ()=>getStorage("cc_notes","")
 );

 const [toast,setToast]=useState("");

 useEffect(()=>{
  saveStorage("cc_dark",darkMode);
  document.documentElement.classList.toggle("dark",darkMode);
 },[darkMode]);

 useEffect(()=>{
  saveStorage("cc_system",gradingSystem)
 },[gradingSystem]);

 useEffect(()=>{
  saveStorage("cc_profile",profile)
 },[profile]);

 useEffect(()=>{
  saveStorage("cc_courses",courses)
 },[courses]);

 useEffect(()=>{
  saveStorage("cc_semesters",semesters)
 },[semesters]);

 useEffect(()=>{
  saveStorage("cc_assignments",assignments)
 },[assignments]);

 useEffect(()=>{
  saveStorage("cc_timetable",timetable)
 },[timetable]);

 useEffect(()=>{
  saveStorage("cc_goals",goals)
 },[goals]);

 useEffect(()=>{
  saveStorage("cc_notes",notes)
 },[notes]);

 function notify(message){
  setToast(message);
  setTimeout(()=>setToast(""),2500);
 }

 function calculateGPA(){

  let points=0,units=0;

  courses.forEach(c=>{

   const u=Math.max(
    0,
    Number(c.unit)||0
   );

   const p=
    GRADE_POINTS[gradingSystem]?.[c.grade]??0;

   points+=u*p;
   units+=u;

  });

  return units
   ?Number((points/units).toFixed(2))
   :0;
 }

 const gpa=calculateGPA();

 function calculateCGPA(){

  let points=0,units=0;

  semesters.forEach(s=>{

   const g=Math.max(
    0,
    Number(s.gpa)||0
   );

   const u=Math.max(
    0,
    Number(s.units)||0
   );

   points+=g*u;
   units+=u;

  });

  return units
   ?Number((points/units).toFixed(2))
   :0;
 }

 const cgpa=calculateCGPA();

 function getRating(value){

  const n=Number(value);
  const max=Number(gradingSystem);

  if(!n)return "Enter your courses";

  const p=n/max;

  if(p>=.8)return "Excellent 🎉";
  if(p>=.7)return "Very Good 👍";
  if(p>=.6)return "Good";
  if(p>=.5)return "Fair";

  return "Keep improving 💪";
 }

 function addCourse(){

  setCourses([
   ...courses,
   {
    id:uid(),
    code:"",
    name:"",
    unit:3,
    grade:"A",
    rating:0,
    shares:0
   }
  ]);

 }

 function updateCourse(id,field,value){

  setCourses(
   courses.map(
    c=>c.id===id
     ?{...c,[field]:value}
     :c
   )
  );

 }

 function removeCourse(id){

  if(courses.length===1){

   setCourses([
    {
     id:uid(),
     code:"",
     name:"",
     unit:3,
     grade:"A",
     rating:0,
     shares:0
    }
   ]);

  }else{

   setCourses(
    courses.filter(c=>c.id!==id)
   );

  }

 }

 async function shareCourse(course){

  const title=
   course.name||
   course.code||
   "My class";

  const text=
   `${title}${course.code&&course.name?" ("+course.code+")":""}\nRating: ${course.rating||0}/5\nShared from CampusCalc.ng`;

  try{

   if(navigator.share){

    await navigator.share({
     title,
     text
    });

    updateCourse(
     course.id,
     "shares",
     (Number(course.shares)||0)+1
    );

   }else{

    await navigator.clipboard.writeText(text);

    updateCourse(
     course.id,
     "shares",
     (Number(course.shares)||0)+1
    );

    notify("Class details copied!");

   }

  }catch{}

 }

 function saveSemester(){

  const units=courses.reduce(
   (sum,c)=>sum+(Number(c.unit)||0),
   0
  );

  if(!units){
   notify("Add course units first.");
   return
  }

  setSemesters([
   ...semesters,
   {
    id:uid(),
    name:`Semester ${semesters.length+1}`,
    gpa,
    units,
    system:gradingSystem,
    date:new Date().toLocaleDateString()
   }
  ]);

  notify("Semester saved successfully!");

 }

 function deleteSemester(id){

  setSemesters(
   semesters.filter(s=>s.id!==id)
  );

 }

 function addAssignment(title,course,date){

  if(!title.trim()){
   notify("Enter an assignment title.");
   return
  }

  setAssignments([
   ...assignments,
   {
    id:uid(),
    title:title.trim(),
    course,
    date,
    completed:false
   }
  ]);

  notify("Assignment added!");

 }

 function toggleAssignment(id){

  setAssignments(
   assignments.map(
    a=>a.id===id
     ?{...a,completed:!a.completed}
     :a
   )
  );

 }

 function deleteAssignment(id){

  setAssignments(
   assignments.filter(a=>a.id!==id)
  );

 }

 function addGoal(title){

  if(!title.trim()){
   notify("Enter a goal.");
   return
  }

  setGoals([
   ...goals,
   {
    id:uid(),
    title:title.trim(),
    completed:false
   }
  ]);

  notify("Goal added!");

 }

 function toggleGoal(id){

  setGoals(
   goals.map(
    g=>g.id===id
     ?{...g,completed:!g.completed}
     :g
   )
  );

 }

 function deleteGoal(id){

  setGoals(
   goals.filter(g=>g.id!==id)
  );

 }

 function addClass(day,course,time,location){

  if(!course.trim()){
   notify("Enter a course.");
   return
  }

  setTimetable([
   ...timetable,
   {
    id:uid(),
    day,
    course:course.trim(),
    time,
    location
   }
  ]);

  notify("Class added!");

 }

 function exportData(){

  const data={
   profile,
   gradingSystem,
   courses,
   semesters,
   assignments,
   timetable,
   goals,
   notes,
   exportedAt:new Date().toISOString()
  };

  const blob=new Blob(
   [JSON.stringify(data,null,2)],
   {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download="campuscalc-backup.json";
  a.click();

  URL.revokeObjectURL(url);

  notify("Backup exported!");

 }

 function importData(event){

  const file=event.target.files?.[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{

   try{

    const d=JSON.parse(reader.result);

    if(d.profile)
     setProfile(d.profile);

    if(d.gradingSystem)
     setGradingSystem(d.gradingSystem);

    if(Array.isArray(d.courses))
     setCourses(d.courses);

    if(Array.isArray(d.semesters))
     setSemesters(d.semesters);

    if(Array.isArray(d.assignments))
     setAssignments(d.assignments);

    if(Array.isArray(d.timetable))
     setTimetable(d.timetable);

    if(Array.isArray(d.goals))
     setGoals(d.goals);

    if(typeof d.notes==="string")
     setNotes(d.notes);

    notify("Backup imported!");

   }catch{

    notify("Invalid backup file.");

   }

  };

  reader.readAsText(file);

  event.target.value="";

 }

 function resetApp(){

  if(!confirm(
   "Delete all CampusCalc data stored on this device?"
  ))return;

  localStorage.clear();
  location.reload();

 }

 function Navbar(){

  return <header className="sticky top-0 z-50 bg-blue-700 text-white shadow-lg">

   <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

    <button
     onClick={()=>setPage("dashboard")}
     className="text-xl font-black"
    >
     Campus<span className="text-blue-200">Calc</span>
     <span className="text-xs ml-1 text-blue-200">.ng</span>
    </button>

    <div className="flex gap-2">

     <button
      onClick={()=>setDarkMode(!darkMode)}
      className="bg-blue-600 rounded-xl px-3 py-2"
     >
      {darkMode?"☀️":"🌙"}
     </button>

     <button
      onClick={()=>setPage("profile")}
      className="bg-blue-600 rounded-xl px-3 py-2"
     >
      👤
     </button>

    </div>

   </div>

  </header>

 }

 function BottomNav(){

  return <nav className="fixed bottom-0 left-0 right-0 z-50 bg-white dark:bg-slate-900 border-t dark:border-slate-800 safe-bottom">

   <div className="max-w-2xl mx-auto grid grid-cols-5">

    <NavButton
     icon="🏠"
     text="Home"
     name="dashboard"
    />

    <NavButton
     icon="📊"
     text="GPA"
     name="gpa"
    />

    <NavButton
     icon="🎯"
     text="CGPA"
     name="cgpa"
    />

    <NavButton
     icon="📝"
     text="Tasks"
     name="tasks"
    />

    <NavButton
     icon="📚"
     text="More"
     name="more"
    />

   </div>

  </nav>

 }

 function NavButton({icon,text,name}){

  return <button
   onClick={()=>setPage(name)}
   className={`py-3 text-xs font-bold ${
    page===name
     ?"text-blue-600"
     :"text-slate-500 dark:text-slate-400"
   }`}
  >

   <div className="text-lg">
    {icon}
   </div>

   {text}

  </button>

 }

 function AppShell({children}){

  return <>
   <Navbar/>
   {children}
   <BottomNav/>

   {toast&&
    <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[60] bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl text-sm font-bold">
     {toast}
    </div>
   }

  </>

 }

 function PageTitle({title,subtitle}){

  return <div className="mb-6">

   <h1 className="text-3xl font-black">
    {title}
   </h1>

   <p className="text-slate-500 dark:text-slate-400 mt-1">
    {subtitle}
   </p>

  </div>

 }

 function StatCard({title,value,subtitle,icon}){

  return <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border dark:border-slate-800">

   <div className="text-2xl">
    {icon}
   </div>

   <div className="text-sm text-slate-500 mt-2">
    {title}
   </div>

   <div className="text-3xl font-black mt-1">
    {value}
   </div>

   <div className="text-xs text-slate-500">
    {subtitle}
   </div>

  </div>

 }

 function QuickCard({icon,title,text,onClick}){

  return <button
   onClick={onClick}
   className="text-left bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800 shadow-sm hover:shadow-md"
  >

   <div className="text-3xl">
    {icon}
   </div>

   <h3 className="font-black text-lg mt-3">
    {title}
   </h3>

   <p className="text-sm text-slate-500 mt-1">
    {text}
   </p>

  </button>

 }

 function EmptyState({icon,text}){

  return <div className="bg-white dark:bg-slate-900 border dark:border-slate-800 rounded-2xl p-10 text-center text-slate-500">

   <div className="text-4xl">
    {icon}
   </div>

   <p className="mt-3">
    {text}
   </p>

  </div>

 }

 function AssignmentForm(){

  const [title,setTitle]=useState("");
  const [course,setCourse]=useState("");
  const [date,setDate]=useState("");

  return <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">

   <div className="grid md:grid-cols-3 gap-3">

    <input
     className="input"
     placeholder="Assignment title"
     value={title}
     onChange={e=>setTitle(e.target.value)}
    />

    <input
     className="input"
     placeholder="Course"
     value={course}
     onChange={e=>setCourse(e.target.value)}
    />

    <input
     className="input"
     type="date"
     value={date}
     onChange={e=>setDate(e.target.value)}
    />

   </div>

   <button
    onClick={()=>{
     addAssignment(title,course,date);
     setTitle("");
     setCourse("");
     setDate("")
    }}
    className="w-full mt-3 bg-blue-600 text-white py-3 rounded-xl font-black"
   >
    + Add Assignment
   </button>

  </div>

 }

 function TimetableForm(){

  const [day,setDay]=useState("Monday");
  const [course,setCourse]=useState("");
  const [time,setTime]=useState("");
  const [location,setLocation]=useState("");

  return <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">

   <div className="grid md:grid-cols-4 gap-3">

    <select
     className="input"
     value={day}
     onChange={e=>setDay(e.target.value)}
    >
     {DAYS.map(d=>
      <option key={d}>{d}</option>
     )}
    </select>

    <input
     className="input"
     placeholder="Course"
     value={course}
     onChange={e=>setCourse(e.target.value)}
    />

    <input
     className="input"
     placeholder="Time e.g. 10:00 AM"
     value={time}
     onChange={e=>setTime(e.target.value)}
    />

    <input
     className="input"
     placeholder="Location"
     value={location}
     onChange={e=>setLocation(e.target.value)}
    />

   </div>

   <button
    onClick={()=>{
     addClass(day,course,time,location);
     setCourse("");
     setTime("");
     setLocation("")
    }}
    className="w-full mt-3 bg-blue-600 text-white py-3 rounded-xl font-black"
   >
    + Add Class
   </button>

  </div>

 }

 function GoalForm(){

  const [title,setTitle]=useState("");

  return <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">

   <div className="flex gap-2">

    <input
     className="input"
     placeholder="e.g. Get 4.5 GPA"
     value={title}
     onChange={e=>setTitle(e.target.value)}
    />

    <button
     onClick={()=>{
      addGoal(title);
      setTitle("")
     }}
     className="bg-blue-600 text-white px-5 rounded-xl font-black"
    >
     Add
    </button>

   </div>

  </div>

 }

 if(page==="dashboard")

 return <AppShell>

  <main className="max-w-7xl mx-auto px-4 py-7 pb-28">

   <section className="bg-gradient-to-br from-blue-700 via-indigo-700 to-purple-700 rounded-3xl p-6 md:p-10 text-white shadow-xl">

    <p className="text-blue-200">
     Welcome back 👋
    </p>

    <h1 className="text-3xl md:text-5xl font-black mt-2">
     {profile.name||"Student"}
    </h1>

    <p className="mt-3 text-blue-100">
     {profile.school||"Your academic dashboard"}
    </p>

    <button
     onClick={()=>setPage("gpa")}
     className="mt-6 bg-white text-blue-700 font-black px-6 py-3 rounded-xl"
    >
     Calculate GPA →
    </button>

   </section>

   <section className="grid md:grid-cols-3 gap-4 mt-6">

    <StatCard
     title="Current GPA"
     value={gpa.toFixed(2)}
     subtitle={`out of ${gradingSystem}`}
     icon="📊"
    />

    <StatCard
     title="CGPA"
     value={cgpa.toFixed(2)}
     subtitle={`out of ${gradingSystem}`}
     icon="🎯"
    />

    <StatCard
     title="Semesters"
     value={semesters.length}
     subtitle="saved"
     icon="📚"
    />

   </section>

   <section className="grid md:grid-cols-2 gap-5 mt-6">

    <QuickCard
     icon="📊"
     title="GPA Calculator"
     text="Calculate your semester GPA."
     onClick={()=>setPage("gpa")}
    />

    <QuickCard
     icon="🎯"
     title="CGPA Calculator"
     text="Track your cumulative GPA."
     onClick={()=>setPage("cgpa")}
    />

    <QuickCard
     icon="📝"
     title="Assignments"
     text={`${assignments.filter(a=>!a.completed).length} pending tasks`}
     onClick={()=>setPage("tasks")}
    />

    <QuickCard
     icon="📅"
     title="Timetable"
     text="Organize your classes."
     onClick={()=>setPage("timetable")}
    />

   </section>

   <section className="mt-7 bg-white dark:bg-slate-900 rounded-2xl p-6 border dark:border-slate-800">

    <h2 className="text-xl font-black">
     Academic Rating
    </h2>

    <p className="text-slate-500 mt-1">
     Based on your current GPA
    </p>

    <div className="mt-4 text-2xl font-black text-blue-600">
     {getRating(gpa)}
    </div>

   </section>

  </main>

 </AppShell>;

 if(page==="gpa")

 return <AppShell>

  <main className="max-w-5xl mx-auto px-4 py-7 pb-28">

   <PageTitle
    title="GPA Calculator"
    subtitle="Calculate your semester GPA."
   />

   <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">

    <div className="flex gap-2 mb-6">

     {["5.0","4.0"].map(s=>

      <button
       key={s}
       onClick={()=>setGradingSystem(s)}
       className={`flex-1 py-3 rounded-xl font-black ${
        gradingSystem===s
         ?"bg-blue-600 text-white"
         :"bg-slate-100 dark:bg-slate-800"
       }`}
      >
       {s} System
      </button>

     )}

    </div>

    <div className="space-y-4">

     {courses.map((c,i)=>

      <div
       key={c.id}
       className="border dark:border-slate-700 rounded-2xl p-4"
      >

       <div className="flex justify-between items-center mb-3">

        <strong>
         Course {i+1}
        </strong>

        <button
         onClick={()=>removeCourse(c.id)}
         className="text-red-500 text-sm font-bold"
        >
         Remove
        </button>

       </div>

       <div className="grid md:grid-cols-5 gap-3">

        <input
         className="input"
         placeholder="Course code"
         value={c.code}
         onChange={e=>
          updateCourse(c.id,"code",e.target.value)
         }
        />

        <input
         className="input"
         placeholder="Course name"
         value={c.name}
         onChange={e=>
          updateCourse(c.id,"name",e.target.value)
         }
        />

        <input
         className="input"
         type="number"
         min="0"
         max="30"
         placeholder="Units"
         value={c.unit}
         onChange={e=>
          updateCourse(c.id,"unit",e.target.value)
         }
        />

        <select
         className="input"
         value={c.grade}
         onChange={e=>
          updateCourse(c.id,"grade",e.target.value)
         }
        >
         {Object.keys(GRADE_POINTS[gradingSystem]).map(g=>
          <option key={g}>{g}</option>
         )}
        </select>

        <div className="flex items-center gap-2">

         <input
          className="input"
          type="number"
          min="0"
          max="5"
          step=".1"
          placeholder="Rate /5"
          value={c.rating}
          onChange={e=>
           updateCourse(c.id,"rating",e.target.value)
          }
         />

        </div>

       </div>

       <div className="mt-3 flex flex-wrap items-center gap-2">

        <span className="text-sm text-slate-500">
         ⭐ {Number(c.rating||0).toFixed(1)}/5
        </span>

        <button
         onClick={()=>shareCourse(c)}
         className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold"
        >
         📤 Share Class
        </button>

        <span className="text-xs text-slate-500">
         Shared {Number(c.shares)||0} time{Number(c.shares)===1?"":"s"}
        </span>

       </div>

      </div>

     )}

    </div>

    <button
     onClick={addCourse}
     className="w-full mt-5 bg-emerald-600 text-white py-3 rounded-xl font-black"
    >
     + Add Course
    </button>

    <div className="mt-7 bg-blue-50 dark:bg-blue-950 rounded-2xl p-7 text-center">

     <p className="text-slate-500 dark:text-blue-200">
      Your GPA
     </p>

     <div className="text-6xl font-black text-blue-600 mt-2">
      {gpa.toFixed(2)}
     </div>

     <p className="mt-2">
      {getRating(gpa)} · / {gradingSystem}
     </p>

     <button
      onClick={saveSemester}
      className="mt-5 bg-blue-600 text-white px-6 py-3 rounded-xl font-black"
     >
      💾 Save Semester
     </button>

    </div>

   </div>

  </main>

 </AppShell>;

 if(page==="cgpa")

 return <AppShell>

  <main className="max-w-5xl mx-auto px-4 py-7 pb-28">

   <PageTitle
    title="CGPA Calculator"
    subtitle="Track your academic performance across semesters."
   />

   <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">

    <div className="mb-6">

     <label className="text-sm font-bold">
      Grading system
     </label>

     <select
      className="input mt-2"
      value={gradingSystem}
      onChange={e=>setGradingSystem(e.target.value)}
     >
      <option value="5.0">5.0 System</option>
      <option value="4.0">4.0 System</option>
     </select>

    </div>

    {!semesters.length&&
     <EmptyState
      icon="🎓"
      text="No semesters saved yet. Save a GPA semester first."
     />
    }

    <div className="space-y-4 mt-4">

     {semesters.map((s,i)=>

      <div
       key={s.id}
       className="border dark:border-slate-700 rounded-2xl p-4"
      >

       <div className="flex justify-between mb-3">

        <strong>
         {s.name||`Semester ${i+1}`}
        </strong>

        <button
         onClick={()=>deleteSemester(s.id)}
         className="text-red-500 text-sm font-bold"
        >
         Delete
        </button>

       </div>

       <div className="grid md:grid-cols-3 gap-3">

        <div className="bg-slate-50 dark:bg-slate-800 rounded-xl p-4">
         <div className="text-xs text-slate-500">
          GPA
         </div>
         <div className="text-2xl font-black">
          {Number(s.gpa).toFixed(2)}
         </div>
        </div>

        <div className="bg-slate-50 dark:bg-slate-800 rounded-xl p-4">
         <div className="text-xs text-slate-500">
          Units
         </div>
         <div className="text-2xl font-black">
          {s.units}
         </div>
        </div>

        <div className="bg-slate-50 dark:bg-slate-800 rounded-xl p-4">
         <div className="text-xs text-slate-500">
          Date
         </div>
         <div className="font-bold mt-1">
          {s.date}
         </div>
        </div>

       </div>

      </div>

     )}

    </div>

    <div className="mt-7 bg-indigo-50 dark:bg-indigo-950 rounded-2xl p-7 text-center">

     <p className="text-slate-500 dark:text-indigo-200">
      Current CGPA
     </p>

     <div className="text-6xl font-black text-indigo-600 mt-2">
      {cgpa.toFixed(2)}
     </div>

     <p className="mt-2">
      out of {gradingSystem}
     </p>

    </div>

   </div>

  </main>

 </AppShell>;

 if(page==="tasks")

 return <AppShell>

  <main className="max-w-4xl mx-auto px-4 py-7 pb-28">

   <PageTitle
    title="Assignments"
    subtitle="Keep track of your academic tasks."
   />

   <AssignmentForm/>

   <div className="mt-6 space-y-3">

    {!assignments.length&&
     <EmptyState
      icon="📝"
      text="No assignments yet."
     />
    }

    {assignments.map(a=>

     <div
      key={a.id}
      className={`bg-white dark:bg-slate-900 border dark:border-slate-800 rounded-2xl p-4 flex items-center gap-4 ${
       a.completed?"opacity-60":""
      }`}
     >

      <button
       onClick={()=>toggleAssignment(a.id)}
       className="text-2xl"
      >
       {a.completed?"✅":"⬜"}
      </button>

      <div className="flex-1">

       <div
        className={`font-bold ${
         a.completed?"line-through":""
        }`}
       >
        {a.title}
       </div>

       <div className="text-sm text-slate-500">
        {a.course||"General"} · {a.date||"No date"}
       </div>

      </div>

      <button
       onClick={()=>deleteAssignment(a.id)}
       className="text-red-500"
      >
       🗑️
      </button>

     </div>

    )}

   </div>

  </main>

 </AppShell>;

 if(page==="timetable")

 return <AppShell>

  <main className="max-w-5xl mx-auto px-4 py-7 pb-28">

   <PageTitle
    title="Timetable"
    subtitle="Organize your weekly classes."
   />

   <TimetableForm/>

   <div className="grid md:grid-cols-2 gap-4 mt-6">

    {!timetable.length&&
     <div className="md:col-span-2">
      <EmptyState
       icon="📅"
       text="Your timetable is empty."
      />
     </div>
    }

    {timetable.map(t=>

     <div
      key={t.id}
      className="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800"
     >

      <div className="flex justify-between">

       <div>

        <div className="text-blue-600 font-black">
         {t.day}
        </div>

        <h3 className="text-xl font-black">
         {t.course}
        </h3>

        <p className="text-slate-500">
         {t.time||"Time not added"}
        </p>

        <p className="text-slate-500">
         📍 {t.location||"Location not added"}
        </p>

       </div>

       <button
        onClick={()=>
         setTimetable(
          timetable.filter(x=>x.id!==t.id)
         )
        }
        className="text-red-500"
       >
        🗑️
       </button>

      </div>

     </div>

    )}

   </div>

  </main>

 </AppShell>;

 if(page==="goals")

 return <AppShell>

  <main className="max-w-4xl mx-auto px-4 py-7 pb-28">

   <PageTitle
    title="Academic Goals"
    subtitle="Set goals and track your progress."
   />

   <GoalForm/>

   <div className="mt-6 space-y-3">

    {!goals.length&&
     <EmptyState
      icon="🎯"
      text="No goals yet."
     />
    }

    {goals.map(g=>

     <div
      key={g.id}
      className={`bg-white dark:bg-slate-900 border dark:border-slate-800 rounded-2xl p-4 flex items-center gap-3 ${
       g.completed?"opacity-60":""
      }`}
     >

      <button
       onClick={()=>toggleGoal(g.id)}
       className="text-xl"
      >
       {g.completed?"✅":"⬜"}
      </button>

      <div
       className={`flex-1 font-bold ${
        g.completed?"line-through":""
       }`}
      >
       {g.title}
      </div>

      <button
       onClick={()=>deleteGoal(g.id)}
       className="text-red-500"
      >
       🗑️
      </button>

     </div>

    )}

   </div>

  </main>

 </AppShell>;

 if(page==="notes")

 return <AppShell>

  <main className="max-w-4xl mx-auto px-4 py-7 pb-28">

   <PageTitle
    title="Study Notes"
    subtitle="Keep useful notes on this device."
   />

   <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">

    <textarea
     className="input min-h-[320px]"
     placeholder="Write your study notes here..."
     value={notes}
     onChange={e=>setNotes(e.target.value)}
    />

    <p className="text-xs text-slate-500 mt-2">
     Saved automatically on this device.
    </p>

   </div>

  </main>

 </AppShell>;

 if(page==="profile")

 return <AppShell>

  <main className="max-w-4xl mx-auto px-4 py-7 pb-28">

   <PageTitle
    title="Student Profile"
    subtitle="Manage your student information."
   />

   <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800 space-y-4">

    {[
     ["name","Full name"],
     ["school","School / University"],
     ["department","Department"],
     ["level","Level"],
     ["matric","Matric number"]
    ].map(([key,label])=>

     <div key={key}>

      <label className="text-sm font-bold">
       {label}
      </label>

      <input
       className="input mt-1"
       value={profile[key]}
       onChange={e=>
        setProfile({
         ...profile,
         [key]:e.target.value
        })
       }
       placeholder={label}
      />

     </div>

    )}

    <button
     onClick={()=>{
      setPage("dashboard");
      notify("Profile saved!")
     }}
     className="w-full bg-blue-600 text-white py-3 rounded-xl font-black"
    >
     Save Profile
    </button>

   </div>

  </main>

 </AppShell>;

 if(page==="settings")

 return <AppShell>

  <main className="max-w-4xl mx-auto px-4 py-7 pb-28">

   <PageTitle
    title="Settings & Data"
    subtitle="Manage your CampusCalc data."
   />

   <div className="space-y-4">

    <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">

     <h2 className="font-black text-lg">
      Appearance
     </h2>

     <button
      onClick={()=>setDarkMode(!darkMode)}
      className="mt-3 bg-slate-100 dark:bg-slate-800 px-5 py-3 rounded-xl font-bold"
     >
      {darkMode?"☀️ Light mode":"🌙 Dark mode"}
     </button>

    </div>

    <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">

     <h2 className="font-black text-lg">
      Backup
     </h2>

     <div className="flex flex-col md:flex-row gap-3 mt-3">

      <button
       onClick={exportData}
       className="bg-blue-600 text-white px-5 py-3 rounded-xl font-bold"
      >
       📤 Export Data
      </button>

      <label className="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold text-center cursor-pointer">

       📥 Import Data

       <input
        type="file"
        accept=".json,application/json"
        onChange={importData}
        className="hidden"
       />

      </label>

     </div>

    </div>

    <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-red-200 dark:border-red-900">

     <h2 className="font-black text-lg">
      Danger zone
     </h2>

     <p className="text-sm text-slate-500 mt-1">
      This removes locally saved CampusCalc data from this device.
     </p>

     <button
      onClick={resetApp}
      className="mt-3 bg-red-600 text-white px-5 py-3 rounded-xl font-bold"
     >
      🔄 Reset All Data
     </button>

    </div>

   </div>

  </main>

 </AppShell>;

 if(page==="more")

 return <AppShell>

  <main className="max-w-5xl mx-auto px-4 py-7 pb-28">

   <PageTitle
    title="More Tools"
    subtitle="More ways to organize your student life."
   />

   <div className="grid md:grid-cols-2 gap-4">

    <QuickCard
     icon="📅"
     title="Timetable"
     text="Organize weekly classes."
     onClick={()=>setPage("timetable")}
    />

    <QuickCard
     icon="🎯"
     title="Academic Goals"
     text="Set goals and track progress."
     onClick={()=>setPage("goals")}
    />

    <QuickCard
     icon="🗒️"
     title="Study Notes"
     text="Keep your study notes."
     onClick={()=>setPage("notes")}
    />

    <QuickCard
     icon="👤"
     title="Student Profile"
     text="Manage your information."
     onClick={()=>setPage("profile")}
    />

    <QuickCard
     icon="⚙️"
     title="Settings & Data"
     text="Backup, import or reset data."
     onClick={()=>setPage("settings")}
    />

   </div>

   <div className="mt-6 bg-white dark:bg-slate-900 rounded-2xl p-5 border dark:border-slate-800">

    <h2 className="font-black">
     CampusCalc.ng
    </h2>

    <p className="text-sm text-slate-500 mt-1">
     Student Academic Toolkit · V3
    </p>

   </div>

  </main>

 </AppShell>;

 return <AppShell>

  <main className="max-w-4xl mx-auto p-6 pb-28">

   <EmptyState
    icon="❓"
    text="Page not found."
   />

  </main>

 </AppShell>;

}

ReactDOM.createRoot(
 document.getElementById("root")
).render(<App/>);

</script>

</body>
</html>
